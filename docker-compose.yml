services:

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: projeto-liga-php
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: mysql
      DB_DATABASE: db_projliga
      DB_USER: root
      DB_PASSWORD: root
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    container_name: projeto-liga-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: